<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />
  <title>Clinic Call List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
      background: #f6f8fb;
      color: #101828;
    }

    .container {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 28px;
    }

    /* Header */

    .header {
      margin-bottom: 16px;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
      letter-spacing: -0.4px;
    }

    .header p {
      margin: 5px 0 0;
      color: #667085;
      font-size: 13px;
    }

    /* Search */

    .search-wrapper {
      position: relative;
      margin-bottom: 14px;
    }

    .search-icon {
      position: absolute;
      left: 13px;
      top: 50%;
      transform: translateY(-50%);
      color: #98a2b3;
      font-size: 16px;
      pointer-events: none;
    }

    #searchInput {
      width: 100%;
      height: 46px;
      padding: 0 42px 0 38px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      background: #ffffff;
      color: #101828;
      font-size: 15px;
      outline: none;
      -webkit-appearance: none;
    }

    #searchInput::placeholder {
      color: #98a2b3;
    }

    #searchInput:focus {
      border-color: #667085;
      box-shadow: 0 0 0 3px rgba(16, 24, 40, 0.06);
    }

    /* Clear button */

    .clear-button {
      position: absolute;
      right: 7px;
      top: 50%;
      transform: translateY(-50%);
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: #667085;
      font-size: 23px;
      line-height: 28px;
      cursor: pointer;
      display: none;
      padding: 0;
    }

    .clear-button:hover {
      background: #f2f4f7;
    }

    .clear-button.visible {
      display: block;
    }

    /* Count */

    .list-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 9px;
    }

    .call-count {
      margin: 0;
      color: #475467;
      font-size: 13px;
      font-weight: 600;
    }

    /* Calls */

    .calls {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Compact card */

    .call-card {
      width: 100%;
      background: #ffffff;
      border: 1px solid #eaecf0;
      border-radius: 10px;
      padding: 13px;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .call-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .caller-name {
      min-width: 0;
      flex: 1;
      font-size: 15px;
      font-weight: 600;
      line-height: 1.35;
      overflow-wrap: anywhere;
    }

    .unknown-name {
      color: #98a2b3;
      font-style: italic;
      font-weight: 500;
    }

    /* Consistent badges */

    .status {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      line-height: 1;
      font-weight: 600;
      white-space: nowrap;
    }

    .status.answered {
      background: #ecfdf3;
      color: #027a48;
    }

    .status.failed {
      background: #fef3f2;
      color: #b42318;
    }

    .status.no_answer {
      background: #fffaeb;
      color: #b54708;
    }

    /* Duration / metadata */

    .call-details {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #667085;
      font-size: 12px;
      line-height: 1.3;
    }

    .call-details span {
      white-space: nowrap;
    }

    .summary {
      margin: 9px 0 0;
      padding-top: 9px;
      border-top: 1px solid #f2f4f7;
      color: #475467;
      font-size: 12.5px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .no-summary {
      color: #98a2b3;
      font-style: italic;
    }

    /* Empty state */

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #eaecf0;
      border-radius: 10px;
    }

    .empty-icon {
      width: 38px;
      height: 38px;
      margin: 0 auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f2f4f7;
      color: #667085;
      font-size: 18px;
    }

    .empty-state h2 {
      margin: 0 0 4px;
      font-size: 15px;
    }

    .empty-state p {
      margin: 0;
      color: #667085;
      font-size: 12.5px;
    }

    /* 375px and smaller */

    @media (max-width: 375px) {
      .container {
        padding: 15px 11px 24px;
      }

      .header h1 {
        font-size: 22px;
      }

      .header p {
        font-size: 12px;
      }

      #searchInput {
        height: 44px;
        font-size: 14px;
      }

      .call-card {
        padding: 12px;
      }

      .caller-name {
        font-size: 14px;
      }

      .status {
        font-size: 10px;
        padding: 3px 7px;
      }

      .summary {
        font-size: 12px;
      }
    }

    /* Very narrow phones */

    @media (max-width: 340px) {
      .call-top {
        flex-direction: column;
        gap: 6px;
      }

      .status {
        align-self: flex-start;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <header class="header">
      <h1>Clinic Call List</h1>
      <p>Recent calls from patients and callers</p>
    </header>

    <div class="search-wrapper">
      <span class="search-icon" aria-hidden="true">⌕</span>

      <input
        type="search"
        id="searchInput"
        placeholder="Search by name..."
        autocomplete="off"
        aria-label="Search calls by name"
      />

      <button
        type="button"
        id="clearButton"
        class="clear-button"
        aria-label="Clear search"
        title="Clear search"
      >
        ×
      </button>
    </div>

    <div class="list-header">
      <p id="callCount" class="call-count"></p>
    </div>

    <section
      id="callsList"
      class="calls"
      aria-live="polite"
    ></section>

  </main>

  <script>
    const calls = [
      {"id": 1, "name": "Anita Sharma", "status": "answered", "duration_secs": 137, "summary": "Booked a follow-up for Friday."},

      {"id": 2, "name": "Rahul Shah", "status": "failed", "duration_secs": 0, "summary": ""},

      {"id": 3, "name": null, "status": "answered", "duration_secs": 64, "summary": "Asked about clinic timings."},

      {"id": 4, "name": "Mohammed Irfan Abdul Rahman Siddiqui", "status": "answered", "duration_secs": 3725, "summary": "Called about his mother's knee surgery. Wanted to know the cost, how many days she would stay, whether insurance is accepted, what to bring on the day, and if the doctor could call him back personally before he decides. Asked the same questions again for his father."},

      {"id": 5, "name": "priya nair", "status": "no_answer", "duration_secs": 0, "summary": ""},

      {"id": 6, "name": "Deepak Verma", "status": "answered", "duration_secs": 212, "summary": "Said the doctor was \\<b>very\\</b> helpful."},

      {"id": 7, "name": "Sunita Rao", "status": "answered", "duration_secs": 59, "summary": "Rescheduled to Monday."},

      {"id": 7, "name": "Sunita Rao", "status": "answered", "duration_secs": 59, "summary": "Rescheduled to Monday."}
    ];

    const callsList = document.getElementById("callsList");
    const searchInput = document.getElementById("searchInput");
    const clearButton = document.getElementById("clearButton");
    const callCount = document.getElementById("callCount");

    function formatDuration(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      const secs = seconds % 60;

      if (hours > 0) {
        return `${hours}h ${minutes}m ${secs}s`;
      }

      if (minutes > 0) {
        return `${minutes}m ${secs}s`;
      }

      return `${secs}s`;
    }

    function formatStatus(status) {
      if (status === "no_answer") {
        return "No answer";
      }

      if (status === "answered") {
        return "Answered";
      }

      if (status === "failed") {
        return "Failed";
      }

      return status;
    }

    function updateCallCount(count) {
      if (count === 0) {
        callCount.textContent = "No calls found";
      } else if (count === 1) {
        callCount.textContent = "1 call";
      } else {
        callCount.textContent = `${count} calls`;
      }
    }

    function escapeHTML(value) {
      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function displayCalls(data) {
      callsList.innerHTML = "";

      updateCallCount(data.length);

      if (data.length === 0) {
        callsList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">⌕</div>
            <h2>No matching calls</h2>
            <p>Try searching for a different name.</p>
          </div>
        `;
        return;
      }

      data.forEach(call => {
        const card = document.createElement("article");
        card.className = "call-card";

        const name = call.name || "Unknown caller";
        const nameClass = call.name
          ? "caller-name"
          : "caller-name unknown-name";

        const summaryHTML = call.summary
          ? `<p class="summary">${escapeHTML(call.summary)}</p>`
          : `<p class="summary no-summary">No summary available.</p>`;

        card.innerHTML = `
          <div class="call-top">
            <div class="${nameClass}">
              ${escapeHTML(name)}
            </div>

            <span class="status ${escapeHTML(call.status)}">
              ${escapeHTML(formatStatus(call.status))}
            </span>
          </div>

          <div class="call-details">
            <span>📞 ${formatDuration(call.duration_secs)}</span>
            <span>Call #${call.id}</span>
          </div>

          ${summaryHTML}
        `;

        callsList.appendChild(card);
      });
    }

    function filterCalls() {
      const searchTerm = searchInput.value.trim().toLowerCase();

      const filteredCalls = calls.filter(call => {
        const name = call.name || "";
        return name.toLowerCase().includes(searchTerm);
      });

      displayCalls(filteredCalls);

      clearButton.classList.toggle(
        "visible",
        searchInput.value.length > 0
      );
    }

    searchInput.addEventListener("input", filterCalls);

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      filterCalls();
      searchInput.focus();
    });

    displayCalls(calls);
  </script>

</body>
</html>
